name: Monitor Astronomy Meetings

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 3:00 AM UTC
  workflow_dispatch:      # Allows manual one-click testing

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run meeting scanner
        run: python bla.py

      - name: Create Issue if matches found
        if: hashFiles('digest.md') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔭 New Astronomy Meetings Alert"
          content-filepath: digest.md
          labels: meeting-alert

      - name: Commit seen meetings log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_meetings.json
          git commit -m "Update seen meetings [skip ci]" || exit 0
          git push
